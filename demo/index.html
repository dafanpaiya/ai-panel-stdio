<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Panel Studio</title>
<style>
:root {
  --bg: #e8ecf8; --surface: #fff; --border: #dce0ef; --border-light: #e8ebf6;
  --text: #1a2142; --text-soft: #4a5178; --text-dim: #8c91a8;
  --accent: #4c68f2; --accent-light: #eef0fd; --accent-soft: #d8dffb;
  --speaking: #22c55e; --speaking-bg: #dcfce7;
  --preparing: #f59e0b; --preparing-bg: #fef3c7; --idle: #c4c8d4;
  --consensus: #16a34a; --divergence: #ea580c;
  --radius: 14px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 2px 12px rgba(26,33,66,0.06);
  --font: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.page{display:none;height:100dvh;width:100vw;overflow:hidden}
.page.active{display:flex;flex-direction:column}

/* 导航 */
.topbar{display:flex;align-items:center;padding:0 16px;height:52px;min-height:52px;background:var(--surface);border-bottom:1px solid var(--border);z-index:200;overflow:hidden}
.topbar-left{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:0}
.topbar-center{flex:1;display:flex;justify-content:center;min-width:0;padding:0 8px}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.brand-mark{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.topic-chip{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);padding:4px 16px;border-radius:999px;background:var(--accent-light);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:6px 14px;border-radius:var(--radius-xs);border:1px solid var(--border);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:500;background:var(--surface);color:var(--text-soft);transition:all 0.15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--accent-light);color:var(--text);border-color:var(--accent-soft)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:#3d56d8;border-color:#3d56d8;color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.btn-danger:hover{background:#fecaca}
.badge{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600}
.badge-live{background:#fef2f2;color:#dc2626}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#dc2626}
.badge-draft{background:#f1f5f9;color:var(--text-dim)}
.badge-ready{background:var(--accent-light);color:var(--accent)}
.badge-running{background:#dcfce7;color:#16a34a}
.badge-paused{background:#fef3c7;color:#d97706}
.badge-ended{background:#f1f5f9;color:var(--text-dim)}
@media(max-width:1100px){.btn-label{display:none}}

/* 首页 */
.home-body{flex:1;overflow-y:auto;padding:28px 36px;display:flex;flex-direction:column;gap:20px}
.home-header{display:flex;justify-content:space-between;align-items:center}
.home-header h1{font-size:22px;font-weight:800}
.discussion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.discussion-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s var(--ease);box-shadow:var(--shadow)}
.discussion-card:hover{border-color:var(--accent-soft);box-shadow:0 4px 20px rgba(26,33,66,.1)}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.topic-text{font-size:15px;font-weight:700;flex:1;margin-right:12px}
.meta-row{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-bottom:12px}
.avatar-strip{display:flex;gap:5px}
.avatar-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}

/* 演播厅 */
.studio-body{flex:1;display:grid;overflow:hidden;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr minmax(200px,320px);grid-template-areas:"moderator insights" "panelists insights" "transcript transcript";gap:10px;padding:12px 16px;background:var(--bg)}
@media(max-width:1439px){.studio-body{grid-template-columns:1fr 270px;grid-template-rows:auto 1fr minmax(180px,280px);gap:8px;padding:10px 12px}}
@media(max-width:1023px){.studio-body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr 260px;grid-template-areas:"moderator" "panelists" "insights" "transcript";gap:8px;padding:8px 10px}.studio-panelists{max-height:320px;overflow-y:auto}.studio-insights{overflow-y:auto !important;flex:1;min-height:0}}

/* 主持人 */
.studio-moderator{grid-area:moderator;background:linear-gradient(135deg,#f0f3fd 0%,#f8f9ff 50%,#eef1fc 100%);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--accent-soft);position:relative;overflow-y:auto}
.studio-moderator::after{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);border-radius:4px 0 0 4px}
.moderator-identity{display:flex;align-items:center;gap:10px;flex-shrink:0}
.moderator-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.moderator-name{font-size:13px;font-weight:700;color:var(--text)}
.moderator-title-text{font-size:11px;color:var(--text-dim)}
.moderator-role-tag{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--accent-light);color:var(--accent);font-weight:600}
.moderator-speech{font-size:13px;line-height:1.65;color:var(--text-soft)}
.quote-mark{color:var(--accent);font-weight:700;font-size:16px}

/* 专家 */
.studio-panelists{grid-area:panelists;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px;align-content:start;overflow-y:auto}
.expert-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;transition:all .25s var(--ease);position:relative;box-shadow:var(--shadow)}
.expert-card.state-speaking{border-color:#86efac;box-shadow:0 0 0 3px var(--speaking-bg),var(--shadow);background:#fafffb}
.expert-card.state-speaking .status-strip{display:block;position:absolute;top:0;left:14px;right:14px;height:3px;background:var(--speaking);border-radius:0 0 3px 3px}
.expert-card.state-preparing{border-color:#fcd34d;box-shadow:0 0 0 3px var(--preparing-bg),var(--shadow)}
.expert-card.state-preparing .status-strip{display:block;position:absolute;top:0;left:14px;right:14px;height:3px;background:var(--preparing);border-radius:0 0 3px 3px}
.status-strip{display:none}
.card-header{display:flex;align-items:center;gap:8px}
.card-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
.expert-card.state-speaking .card-avatar{box-shadow:0 0 0 3px var(--speaking-bg)}
.expert-card.state-preparing .card-avatar{box-shadow:0 0 0 3px var(--preparing-bg)}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:700}
.card-title{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-status-row{display:flex;align-items:center;gap:6px}
.status-lamp{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-lamp.idle{background:var(--idle)}
.status-lamp.preparing{background:var(--preparing)}
.status-lamp.speaking{background:var(--speaking)}
.status-label{font-size:11px;font-weight:600}
.status-label.idle{color:var(--text-dim)}
.status-label.preparing{color:var(--preparing)}
.status-label.speaking{color:var(--speaking)}
.card-focus{font-size:11px;line-height:1.5;color:var(--text-soft);padding:8px 10px;background:#f8f9fc;border-radius:var(--radius-xs);min-height:32px}
.expert-card.state-speaking .card-focus{background:var(--speaking-bg)}
.expert-card.state-preparing .card-focus{background:var(--preparing-bg)}

/* 共识/分歧 */
.studio-insights{grid-area:insights;overflow-y:auto !important;display:flex;flex-direction:column;gap:12px;min-height:0;height:100%}
.insight-section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.insight-section-title{display:flex;align-items:center;gap:6px;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--text-soft);border-bottom:1px solid var(--border-light)}
.icon-dot{width:7px;height:7px;border-radius:2px}
.icon-dot.consensus{background:var(--consensus)}
.icon-dot.divergence{background:var(--divergence)}
.tally{font-weight:400;margin-left:auto;color:var(--text-dim)}
.insight-entry{padding:10px 14px;font-size:12px;line-height:1.55;border-bottom:1px solid var(--border-light)}
.insight-entry:last-child{border-bottom:none}
.insight-entry.consensus{border-left:3px solid var(--consensus)}
.insight-entry.divergence{border-left:3px solid var(--divergence)}
.stance-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stance-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600}
.stance-pill.pro{background:#eef2ff;color:var(--accent)}
.stance-pill.con{background:#fff7ed;color:var(--divergence)}

/* Transcript */
.studio-transcript{grid-area:transcript;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel-header{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;font-weight:700;color:var(--text-soft);border-bottom:1px solid var(--border-light)}
.rec-dot{width:7px;height:7px;border-radius:50%;background:#dc2626}
.transcript-list{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column}
.transcript-item{display:flex;gap:10px;padding:8px 12px;border-radius:var(--radius-xs);font-size:12px;line-height:1.6}
.transcript-item:hover{background:#f8f9fc}
.color-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch}
.utt-body{flex:1;min-width:0}
.utt-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.utt-name{font-weight:700;font-size:12px}
.utt-role{font-weight:400;font-size:10px;color:var(--text-dim)}
.utt-text{color:var(--text-soft);word-break:break-word}

/* 底部 */
.studio-footer{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 20px 10px}
.control-bar{display:flex;align-items:center;gap:14px;padding:2px 0 6px}
.control-bar .meta{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
.control-bar .meta:first-child{margin-right:auto}
.control-lamp{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--speaking)}
.control-lamp.paused{background:var(--preparing)}
.interject-bar{display:flex;gap:8px}
.interject-bar input{flex:1;padding:8px 14px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);min-width:0}
.interject-bar input::placeholder{color:var(--text-dim)}
.interject-bar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,104,242,.1)}

/* 向导 */
.wizard-body{flex:1;overflow-y:auto;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:24px}
.wizard-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.wizard-card h2{font-size:18px;font-weight:700}
.wizard-card label{font-size:13px;font-weight:600;color:var(--text-soft);display:flex;flex-direction:column;gap:6px}
.wizard-card input[type=text],.wizard-card input[type=number]{padding:8px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);font-size:14px;font-family:var(--font)}
.wizard-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,104,242,.1)}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px}
.panel-card .p-name{font-size:14px;font-weight:700}
.panel-card .p-role{font-size:11px;color:var(--accent);font-weight:600}
.panel-card .p-meta{font-size:12px;color:var(--text-dim)}
.panel-card .p-stance{font-size:12px;color:var(--text-soft);line-height:1.4;margin-top:4px;padding:8px 10px;background:#f8f9fc;border-radius:var(--radius-xs)}
.panel-card .p-color{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
.color-swatch{width:16px;height:16px;border-radius:50%;flex-shrink:0}

/* 设置 */
.settings-body{flex:1;overflow-y:auto;padding:40px;display:flex;flex-direction:column;align-items:center}
.settings-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.settings-card h2{font-size:18px;font-weight:700}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:999;animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* 空态 */
.empty-state{text-align:center;padding:40px;color:var(--text-dim)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- 首页 -->
<div class="page active" id="page-home">
  <div class="topbar">
    <div class="topbar-left"><div class="brand"><div class="brand-mark">P</div>AI Panel Studio</div></div>
    <div class="topbar-right">
      <button class="btn btn-sm" onclick="showSettings()">设置</button>
      <button class="btn btn-primary" onclick="showWizard()">＋ 发起新讨论</button>
    </div>
  </div>
  <div class="home-body" id="home-body">
    <div class="home-header"><h1>我的讨论</h1><span style="color:var(--text-dim);font-size:12px" id="disc-count">加载中…</span></div>
    <div class="discussion-grid" id="disc-list"><div class="empty-state">加载讨论列表…</div></div>
    <div id="home-loading" class="empty-state" style="display:none">加载中…</div>
  </div>
</div>

<!-- 阵容生成向导 -->
<div class="page" id="page-wizard">
  <div class="topbar">
    <div class="topbar-left"><button class="btn btn-sm" onclick="showHome()">←<span class="btn-label"> 返回</span></button><div class="brand"><div class="brand-mark">P</div>AI Panel Studio</div></div>
    <div class="topbar-right"></div>
  </div>
  <div class="wizard-body" id="wizard-body">
    <div class="wizard-card" id="wizard-step1">
      <h2>发起新讨论</h2>
      <label>讨论话题 <input type="text" id="wiz-topic" placeholder="例如：AI 是否应该拥有法律人格？"></label>
      <label>专家人数 <input type="number" id="wiz-experts" value="4" min="1" max="8"></label>
      <label>最大轮次 <input type="number" id="wiz-rounds" value="20" min="10" max="40"></label>
      <button class="btn btn-primary" onclick="createDiscussion()" style="align-self:flex-start">创建并生成嘉宾</button>
    </div>
    <div class="wizard-card" id="wizard-step2" style="display:none">
      <h2>嘉宾阵容 <span style="font-size:12px;font-weight:400;color:var(--text-dim)" id="wiz-topic-display"></span></h2>
      <div class="panel-grid" id="panel-grid"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="confirmAndStart()">确认阵容，开始讨论</button>
        <button class="btn" onclick="regeneratePanel()">重新生成</button>
        <button class="btn" onclick="showWizard()">重新设置</button>
      </div>
    </div>
  </div>
</div>

<!-- 演播厅 -->
<div class="page" id="page-studio">
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn btn-sm" onclick="showHome()">←<span class="btn-label"> 返回</span></button>
      <div class="brand" style="font-size:14px"><div class="brand-mark" style="width:24px;height:24px;font-size:11px">P</div><span class="btn-label">AI Panel Studio</span></div>
    </div>
    <div class="topbar-center"><span class="topic-chip" id="studio-topic">加载中…</span></div>
    <div class="topbar-right">
      <span class="badge badge-live" id="badge-live"><span class="btn-label" id="badge-live-text">直播中</span></span>
      <button class="btn btn-sm" id="btn-pause" onclick="togglePause()">⏸<span class="btn-label"> 暂停</span></button>
      <button class="btn btn-sm btn-danger" onclick="endDiscussion()">⏹<span class="btn-label"> 结束</span></button>
    </div>
  </div>
  <div class="studio-body">
    <div class="studio-moderator" id="moderator-zone">
      <div class="moderator-identity"><div class="moderator-avatar" style="background:var(--accent)">?</div><div><span class="moderator-name">—</span><span class="moderator-title-text"></span></div><span class="moderator-role-tag">主持人</span></div>
      <div class="moderator-speech" style="color:var(--text-dim)">等待开场…</div>
    </div>
    <div class="studio-panelists" id="panelist-grid"><div class="empty-state" style="grid-column:1/-1">加载专家信息…</div></div>
    <div class="studio-insights" id="insights-panel">
      <div class="insight-section"><div class="insight-section-title"><span class="icon-dot consensus"></span>已达成共识<span class="tally" id="consensus-count">0 项</span></div><div id="consensus-list"></div></div>
      <div class="insight-section"><div class="insight-section-title"><span class="icon-dot divergence"></span>核心分歧<span class="tally" id="divergence-count">0 项</span></div><div id="divergence-list"></div></div>
    </div>
    <div class="studio-transcript">
      <div class="panel-header"><span class="rec-dot"></span>讨论实录<span style="font-weight:400;margin-left:auto;font-size:11px;color:var(--text-dim)" id="utt-count">0 条发言</span></div>
      <div class="transcript-list" id="transcript-list"><div class="empty-state">等待讨论开始…</div></div>
    </div>
  </div>
  <div class="studio-footer">
    <div class="control-bar">
      <span class="meta"><span class="control-lamp" id="control-lamp"></span><span id="control-status-text">讨论进行中</span></span>
      <span class="meta" id="control-round">第 0 轮 / 共 0 轮</span>
    </div>
    <div class="interject-bar">
      <input type="text" placeholder="输入追问内容，主持人将引导专家讨论…" id="interject-input">
      <button class="btn btn-primary btn-sm" onclick="sendInterject()">发送追问</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="page" id="page-settings">
  <div class="topbar">
    <div class="topbar-left"><button class="btn btn-sm" onclick="showHome()">←<span class="btn-label"> 返回</span></button><div class="brand"><div class="brand-mark">P</div>AI Panel Studio</div></div>
    <div class="topbar-right"></div>
  </div>
  <div class="settings-body">
    <div class="settings-card">
      <h2>API Key 设置</h2>
      <label>已配置 Provider: <strong id="settings-active">加载中…</strong></label>
      <div id="provider-list" style="display:flex;flex-direction:column;gap:8px"></div>
      <div style="border-top:1px solid var(--border-light);padding-top:12px;display:flex;flex-direction:column;gap:10px">
        <label>Provider <select id="set-provider" style="padding:6px;border:1px solid var(--border);border-radius:4px"><option>deepseek</option><option>openai</option><option>anthropic</option><option>custom</option></select></label>
        <label>API Key <input type="password" id="set-key" placeholder="sk-…" style="padding:6px;border:1px solid var(--border);border-radius:4px;font-family:var(--font)"></label>
        <label>Base URL <input type="text" id="set-url" placeholder="https://api.deepseek.com" style="padding:6px;border:1px solid var(--border);border-radius:4px;font-family:var(--font)"></label>
        <label>Model <input type="text" id="set-model" placeholder="deepseek-v4-flash" style="padding:6px;border:1px solid var(--border);border-radius:4px;font-family:var(--font)"></label>
        <button class="btn btn-primary" onclick="saveApiKey()" style="align-self:flex-start">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
// ====== 状态 ======
const API = 'http://127.0.0.1:8000/api';
let studioDiscussionId = null;
let studioSSE = null;
let studioPaused = false;
let studioPanelists = [];
let studioModerator = null;

// ====== 工具 ======
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function statusBadge(s){const map={draft:'badge-draft 草稿',lineup_ready:'badge-ready 阵容就绪',running:'badge-running 进行中',paused:'badge-paused 已暂停',ended:'badge-ended 已结束'};const cls=map[s]||'badge-draft';const parts=cls.split(' ');return `<span class="badge ${parts[0]}">${parts.slice(1).join(' ')}</span>`}
function avatarColor(name,color){return `<div class="avatar-dot" style="background:${color}">${name[0]}</div>`}

// ====== 页面路由 ======
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const pg=document.getElementById('page-'+id);if(pg)pg.classList.add('active')}
function showHome(){disconnectSSE();showPage('home');loadDiscussions()}
function showWizard(){disconnectSSE();showPage('wizard');document.getElementById('wizard-step2').style.display='none';document.getElementById('wizard-step1').style.display=''}
function showStudio(){showPage('studio')}
function showSettings(){showPage('settings');loadSettings()}

// ====== 讨论列表 ======
async function loadDiscussions(){
  try{
    const r=await fetch(`${API}/discussions`);const data=await r.json();
    document.getElementById('disc-count').textContent='共 '+data.total+' 场';
    if(!data.discussions.length){document.getElementById('disc-list').innerHTML='<div class="empty-state">暂无讨论，点击右上角发起新讨论</div>';return}
    document.getElementById('disc-list').innerHTML=data.discussions.map(d=>{
      const colors=[d.color||'#4c68f2'];const avatars=Array.from({length:d.panelist_count||0},(_,i)=>avatarColor('?',['#4c68f2','#E57373','#81C784','#FFB74D','#BA68C8'][i%5])).join('');
      return `<div class="discussion-card" onclick="joinDiscussion('${d.id}')">
        <div class="card-row"><div class="topic-text">${escapeHtml(d.topic)}</div>${statusBadge(d.status)}</div>
        <div class="meta-row"><span>${d.panelist_count||0} 位嘉宾</span><span>第 ${d.current_round}/${d.max_rounds} 轮</span><span>${d.utterance_count||0} 条发言</span></div>
        <div class="avatar-strip">${avatars}</div>
      </div>`}).join('')
  }catch(e){document.getElementById('disc-list').innerHTML='<div class="empty-state">无法连接后端，请确认服务已启动 (localhost:8000)</div>'}
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== 创建讨论 + 生成阵容 ======
let wizardDiscussionId = null;
async function createDiscussion(){
  const topic=document.getElementById('wiz-topic').value.trim();
  const experts=parseInt(document.getElementById('wiz-experts').value)||4;
  const rounds=parseInt(document.getElementById('wiz-rounds').value)||20;
  if(!topic){toast('请输入讨论话题');return}
  try{
    const r=await fetch(`${API}/discussions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,expert_count:experts,max_rounds:rounds})});
    const d=await r.json();wizardDiscussionId=d.id;
    // 生成阵容（使用真实LLM）
    const r2=await fetch(`${API}/discussions/${d.id}/panel/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expert_count:experts})});
    if (!r2.ok) { toast('生成阵容失败'); return; }
    var panel=await r2.json();
    // 如果返回的面板为空或没有panel字段，重试一次
    if (!panel.panel || !panel.panel.length) {
      await new Promise(r=>setTimeout(r,2000));
      const retry=await fetch(`${API}/discussions/${d.id}/panel/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expert_count:experts})});
      if (!retry.ok) { toast('重试生成阵容失败'); return; }
      panel=await retry.json();
    }
    renderPanel(panel.panel,topic);
    document.getElementById('wizard-step1').style.display='none';
    document.getElementById('wizard-step2').style.display='';
    document.getElementById('wiz-topic-display').textContent=topic;
  }catch(e){toast('创建失败: '+e.message)}
}
function renderPanel(panel,topic){
  document.getElementById('panel-grid').innerHTML=panel.map(p=>`<div class="panel-card">
    <div class="p-role">${p.role==='moderator'?'主持人':'专家'}</div>
    <div class="p-name">${p.name}</div>
    <div class="p-meta">${p.occupation} · ${p.title}</div>
    <div class="p-stance">${p.stance}</div>
    <div class="p-color"><span class="color-swatch" style="background:${p.color}"></span>${p.color}</div>
  </div>`).join('')
}
async function regeneratePanel(){
  if(!wizardDiscussionId)return;
  document.getElementById('panel-grid').innerHTML='<div class="empty-state">重新生成中…</div>';
  try{
    const r=await fetch(`${API}/discussions/${wizardDiscussionId}/panel/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expert_count:parseInt(document.getElementById('wiz-experts').value)||4})});
    if (!r.ok) { toast('重新生成失败'); return; }
    var panel=await r.json();
    if (!panel.panel || !panel.panel.length) {
      await new Promise(r=>setTimeout(r,2000));
      const retry=await fetch(`${API}/discussions/${wizardDiscussionId}/panel/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expert_count:parseInt(document.getElementById('wiz-experts').value)||4})});
      if (!retry.ok) { toast('重试失败'); return; }
      panel=await retry.json();
    }
    renderPanel(panel.panel,document.getElementById('wiz-topic-display').textContent);
    toast('嘉宾已重新生成');
  }catch(e){toast('重新生成失败: '+e.message)}
}
async function confirmAndStart(){
  if(!wizardDiscussionId)return;
  try{
    const r=await fetch(`${API}/discussions/${wizardDiscussionId}/start`,{method:'POST'});
    if (!r.ok) { const err=await r.json(); toast('启动失败: '+(err.detail?.message||'请先生成嘉宾阵容')); return; }
    toast('讨论已启动，正在进入演播厅…');
    await joinDiscussion(wizardDiscussionId);
  }catch(e){toast('启动失败: '+e.message)}
}

// ====== 加入/启动讨论 ======
async function joinDiscussion(did){
  // 先加载面板信息
  try{
    const r=await fetch(`${API}/discussions/${did}/panel`);
    const panel=await r.json();
    studioPanelists=panel.panel;
    studioModerator=panel.panel.find(p=>p.role==='moderator');
  }catch(e){}
  // 加载 transcript 历史
  try{
    const r=await fetch(`${API}/discussions/${did}/transcript?limit=200`);
    const data=await r.json();
    document.getElementById('transcript-list').innerHTML='';
    if(data.items) data.items.forEach(u=>appendUtterance(u));
  }catch(e){}
  // 加载共识/分歧
  try{
    const r=await fetch(`${API}/discussions/${did}/insights`);
    const ins=await r.json();
    renderInsights(ins);
  }catch(e){}
  // 讨论详情
  try{
    const r=await fetch(`${API}/discussions/${did}`);
    const d=await r.json();
    document.getElementById('studio-topic').textContent=d.topic;
    document.getElementById('control-round').textContent=`第 ${d.current_round} 轮 / 共 ${d.max_rounds} 轮`;
    renderPanelists();
  }catch(e){}
  studioDiscussionId=did;
  showStudio();
  connectSSE(did);
}
function renderPanelists(){
  const grid=document.getElementById('panelist-grid');
  if(!studioPanelists.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1">暂无专家信息</div>';return}
  grid.innerHTML=studioPanelists.filter(p=>p.role==='expert').map(p=>`<div class="expert-card" id="card-${p.id}">
    <div class="status-strip"></div>
    <div class="card-header"><div class="card-avatar" style="background:${p.color}">${p.name[0]}</div><div class="card-info"><div class="card-name">${p.name}</div><div class="card-title">${p.occupation} · ${p.title}</div></div></div>
    <div class="card-status-row"><span class="status-lamp idle"></span><span class="status-label idle">待机</span></div>
    <div class="card-focus">${p.stance}</div>
  </div>`).join('')
  // 主持人
  if(studioModerator){
    document.getElementById('moderator-zone').innerHTML=`
      <div class="moderator-identity"><div class="moderator-avatar" style="background:${studioModerator.color}">${studioModerator.name[0]}</div><div><span class="moderator-name">${studioModerator.name}</span><span class="moderator-title-text"> · ${studioModerator.occupation}</span></div><span class="moderator-role-tag">主持人</span></div>
      <div class="moderator-speech" id="mod-speech" style="color:var(--text-dim)">等待开场…</div>`
  }
}

// ====== SSE ======
function connectSSE(did){
  disconnectSSE();
  studioSSE=new EventSource(`${API}/discussions/${did}/stream`);
  studioSSE.addEventListener('utterance',e=>{
    const data=JSON.parse(e.data);
    appendUtterance(data);
    document.getElementById('utt-count').textContent=(parseInt(document.getElementById('utt-count').textContent)||0)+1+' 条发言';
    // 滚动
    const list=document.getElementById('transcript-list');
    list.scrollTop=list.scrollHeight;
  });
  studioSSE.addEventListener('panelist_status',e=>{
    const data=JSON.parse(e.data);
    updateExpertCard(data);
  });
  studioSSE.addEventListener('consensus_update',e=>{
    const data=JSON.parse(e.data);
    addInsightItem('consensus',data.consensus);
  });
  studioSSE.addEventListener('divergence_update',e=>{
    const data=JSON.parse(e.data);
    addInsightItem('divergence',data.divergence);
  });
  studioSSE.addEventListener('moderating',e=>{
    const data=JSON.parse(e.data);
    const speech=document.getElementById('mod-speech');
    if(speech)speech.textContent=data.message;
  });
  studioSSE.addEventListener('discussion_ended',e=>{
    const data=JSON.parse(e.data);
    document.getElementById('badge-live-text').textContent='已结束';
    document.getElementById('badge-live').className='badge badge-ended';
    document.getElementById('control-status-text').textContent='已结束';
    document.getElementById('btn-pause').style.display='none';
    if(document.getElementById('mod-speech'))document.getElementById('mod-speech').textContent=data.summary;
    disconnectSSE();
    toast('讨论已结束');
  });
  studioSSE.onerror=()=>{/* reconnect handled by browser */};
}
function disconnectSSE(){if(studioSSE){studioSSE.close();studioSSE=null}}

// ====== Transcript ======
function appendUtterance(data){
  const list=document.getElementById('transcript-list');
  const p=data.panelist||{name:'?',occupation:'',title:'',color:'#999',role:'expert'};
  const div=document.createElement('div');
  div.className='transcript-item';
  div.innerHTML=`<div class="color-bar" style="background:${p.color}"></div><div class="utt-body"><div class="utt-meta"><span class="utt-name">${p.name}</span><span class="utt-role">${p.role==='moderator'?'主持人':'专家'} · ${p.occupation}</span></div><div class="utt-text">${escapeHtml(data.content)}</div></div>`;
  list.appendChild(div);
  list.scrollTop=list.scrollHeight;
}
function updateExpertCard(data){
  const card=document.getElementById('card-'+data.panelist_id);
  if(!card)return;
  card.classList.remove('state-speaking','state-preparing');
  const lamp=card.querySelector('.status-lamp');
  const label=card.querySelector('.status-label');
  const focus=card.querySelector('.card-focus');
  lamp.className='status-lamp';label.className='status-label';
  if(data.status==='speaking'){card.classList.add('state-speaking');lamp.classList.add('speaking');label.classList.add('speaking');label.textContent='发言中'}
  else if(data.status==='preparing'){card.classList.add('state-preparing');lamp.classList.add('preparing');label.classList.add('preparing');label.textContent='准备发言'}
  else{lamp.classList.add('idle');label.classList.add('idle');label.textContent='待机'}
  if(data.focus)focus.textContent=data.focus;
}

// ====== 共识/分歧 ======
function addInsightItem(type,insight){
  const listId=type==='consensus'?'consensus-list':'divergence-list';
  const countId=type==='consensus'?'consensus-count':'divergence-count';
  const list=document.getElementById(listId);
  const entry=document.createElement('div');
  entry.className='insight-entry '+type;
  entry.textContent=insight.content;
  if(type==='divergence'&&insight.opposing_sides&&insight.opposing_sides.length){
    const row=document.createElement('div');row.className='stance-row';
    insight.opposing_sides.forEach((s,i)=>{const pill=document.createElement('span');pill.className='stance-pill '+(i===0?'pro':'con');pill.textContent=s.side;row.appendChild(pill)});
    entry.appendChild(row);
  }
  list.insertBefore(entry,list.firstChild);
  const countEl=document.getElementById(countId);
  const n=list.querySelectorAll('.insight-entry').length;
  countEl.textContent=n+' 项';
}
function renderInsights(ins){
  document.getElementById('consensus-list').innerHTML='';
  document.getElementById('divergence-list').innerHTML='';
  if(ins.consensus)ins.consensus.forEach(c=>addInsightItem('consensus',c));
  if(ins.divergence)ins.divergence.forEach(d=>addInsightItem('divergence',d));
}

// ====== 控制 ======
async function togglePause(){
  if(!studioDiscussionId)return;
  studioPaused=!studioPaused;
  const btn=document.getElementById('btn-pause');
  btn.innerHTML=studioPaused?'▶<span class="btn-label"> 继续</span>':'⏸<span class="btn-label"> 暂停</span>';
  try{
    if(studioPaused)await fetch(`${API}/discussions/${studioDiscussionId}/pause`,{method:'POST'});
    else await fetch(`${API}/discussions/${studioDiscussionId}/resume`,{method:'POST'});
  }catch(e){toast('操作失败')}
  document.getElementById('control-lamp').className='control-lamp'+(studioPaused?' paused':'');
  document.getElementById('control-status-text').textContent=studioPaused?'已暂停':'讨论进行中';
  document.getElementById('badge-live').className='badge badge-live'+(studioPaused?' paused':'');
  document.getElementById('badge-live-text').textContent=studioPaused?'已暂停':'直播中';
}
async function endDiscussion(){
  if(!studioDiscussionId||!confirm('确认结束讨论？'))return;
  try{await fetch(`${API}/discussions/${studioDiscussionId}/end`,{method:'POST'});toast('正在收尾…')}catch(e){toast('结束失败')}
}
async function sendInterject(){
  const input=document.getElementById('interject-input');
  const msg=input.value.trim();
  if(!msg||!studioDiscussionId)return;
  try{
    await fetch(`${API}/discussions/${studioDiscussionId}/interject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    input.value='';
    toast('追问已提交');
  }catch(e){toast('追问失败')}
}

// ====== 设置 ======
async function loadSettings(){
  try{
    const r=await fetch(`${API}/settings/llm`);
    const s=await r.json();
    document.getElementById('settings-active').textContent=s.active_provider;
    document.getElementById('provider-list').innerHTML=s.providers.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light)">
      <span style="font-weight:600;min-width:80px">${p.label||p.provider}</span>
      <span style="color:var(--text-dim);flex:1">${p.api_key_masked||'(未配置)'}</span>
      <span style="font-size:11px;color:var(--text-dim)">${p.model}</span>
      <span style="font-size:11px;color:${p.has_key?'var(--speaking)':'var(--text-dim)'}">${p.has_key?'已配置':'未配置'}</span>
    </div>`).join('');
    // 如果已有 key，填充表单
    const dp=s.providers.find(p=>p.provider==='deepseek');
    if(dp&&dp.has_key){document.getElementById('set-key').value='••••••••';document.getElementById('set-url').value=dp.base_url;document.getElementById('set-model').value=dp.model}
  }catch(e){}
}
async function saveApiKey(){
  const provider=document.getElementById('set-provider').value;
  const key=document.getElementById('set-key').value.trim();
  const url=document.getElementById('set-url').value.trim();
  const model=document.getElementById('set-model').value.trim();
  if(!key||key==='••••••••'){toast('请输入 API Key');return}
  try{
    const body={provider,api_key:key};
    if(url)body.base_url=url;
    if(model)body.model=model;
    await fetch(`${API}/settings/llm/key`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('API Key 已保存');
    loadSettings();
  }catch(e){toast('保存失败: '+e.message)}
}

// ====== 初始化 ======
loadDiscussions();
// 定时刷新首页列表
setInterval(()=>{if(document.getElementById('page-home').classList.contains('active'))loadDiscussions()},10000);
</script>
</body>
</html>
